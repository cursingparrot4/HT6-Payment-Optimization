[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-optimization-engine"
version = "0.1.0"
description = "Deterministic synthetic payment routing with a language-to-intent adapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=5.5,<6",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "numpy>=2.1,<3",
    "pulp>=3.2,<4",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "streamlit>=1.47,<2",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "data*", "engine*", "eval*", "explain*", "intent*", "ui*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
